<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Leeds Station - Concourse Board</title>
  <style>
    :root {
      --bg-black: #000000;
      --board-frame: #121820;
      --screen-bg: #030508;
      --border-dark: #1b2432;
      --text-white: #ffffff;
      --text-gray: #8e9bb0;
      --text-amber: #fabb15;
      --text-red: #ff4d4d;
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 8px) 8px;
    }

    .mobile-container {
      width: 100%;
      max-width: 430px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Main Physical Metal Frame */
    .concourse-frame {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      background-color: var(--board-frame);
      padding: 8px;
      border: 2px solid #283344;
      border-radius: 10px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.9);
    }

    .board-screen {
      background-color: var(--screen-bg);
      border: 1px solid var(--border-dark);
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
    }

    .screen-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1a2536;
      padding-bottom: 4px;
      margin-bottom: 6px;
    }

    .screen-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--text-white);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .page-tag {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-gray);
    }

    .dept-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .dept-item {
      display: flex;
      flex-direction: column;
      width: 100%;
      padding-bottom: 4px;
      border-bottom: 1px dashed #121a26;
    }

    .dept-main-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      width: 100%;
      gap: 4px;
    }

    .dept-time {
      font-weight: 800;
      font-size: 0.9rem;
      color: var(--text-white);
      font-family: ui-monospace, SFMono-Regular, monospace;
      min-width: 44px;
    }

    .dept-dest {
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--text-white);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: uppercase;
      flex-grow: 1;
    }

    .dept-plat {
      font-weight: 800;
      font-size: 0.85rem;
      color: var(--text-white);
      text-align: center;
      font-family: ui-monospace, SFMono-Regular, monospace;
      min-width: 32px;
    }

    .dept-status {
      font-weight: 800;
      font-size: 0.82rem;
      text-align: right;
      min-width: 65px;
    }

    .status-ontime { color: var(--text-white); }
    .status-delayed { color: var(--text-amber); }
    .status-cancelled { color: var(--text-red); }

    /* Full-Width Continuous Marquee Line */
    .marquee-container {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      margin-top: 2px;
      position: relative;
    }

    .marquee-text {
      display: inline-block;
      font-size: 0.73rem;
      color: var(--text-gray);
      font-family: ui-monospace, SFMono-Regular, monospace;
      padding-left: 100%;
      animation: continuousMarquee 15s linear infinite;
      will-change: transform;
    }

    .marquee-text.notice {
      color: var(--text-amber);
      font-weight: 600;
    }

    @keyframes continuousMarquee {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }

    /* Screen 3: Welcome & Real-Time Clock Panel */
    .welcome-screen {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: linear-gradient(180deg, #05080e 0%, #030508 100%);
    }

    .welcome-text {
      font-size: 1.25rem;
      font-weight: 800;
      line-height: 1.1;
      color: var(--text-white);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .clock-box {
      font-family: ui-monospace, SFMono-Regular, monospace;
      color: var(--text-white);
      display: flex;
      align-items: baseline;
    }

    .clock-hhmm {
      font-size: 2.3rem;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
    }

    .clock-ss {
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1;
      margin-left: 1px;
      color: var(--text-amber);
    }

    /* Coach Formation Sub-Panel */
    .sub-panel {
      width: 100%;
      background-color: var(--board-frame);
      border: 1px solid var(--border-dark);
      border-radius: 8px;
      padding: 8px 10px;
    }

    .sub-panel-title {
      color: var(--text-amber);
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .formation-row {
      display: flex;
      gap: 5px;
      align-items: center;
      overflow-x: auto;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
    }

    .coach-box {
      background-color: #1a2332;
      border: 1px solid #2d3b52;
      padding: 4px 8px;
      border-radius: 4px;
      text-align: center;
      font-weight: bold;
      font-size: 0.72rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .coach-box.first {
      background-color: #854d0e;
      border-color: #a16207;
      color: var(--text-white);
    }
  </style>
</head>
<body>

  <div class="mobile-container">
    <div class="concourse-frame">
      
      <!-- SCREEN 1: DEPARTURES -->
      <div class="board-screen">
        <div class="screen-header">
          <span class="screen-title">Departures</span>
          <span class="page-tag" id="page1-tag">Page 1 of 2</span>
        </div>
        <div class="dept-list" id="screen1-list"></div>
      </div>

      <!-- SCREEN 2: DEPARTURES -->
      <div class="board-screen">
        <div class="screen-header">
          <span class="screen-title">Departures</span>
          <span class="page-tag" id="page2-tag">Page 2 of 2</span>
        </div>
        <div class="dept-list" id="screen2-list"></div>
      </div>

      <!-- SCREEN 3: WELCOME TO LEEDS & REAL-TIME CLOCK -->
      <div class="board-screen welcome-screen">
        <div class="welcome-text">
          Welcome<br>to Leeds
        </div>

        <div class="clock-box">
          <span class="clock-hhmm" id="clock-hhmm">00:21</span>
          <span class="clock-ss" id="clock-ss">18</span>
        </div>
      </div>

    </div>

    <!-- COACH FORMATION SUB-PANEL -->
    <div class="sub-panel">
      <div class="sub-panel-title" id="next-service-label">Next Service Coach Formation</div>
      <div class="formation-row" id="formation-row"></div>
    </div>
  </div>

  <script>
    // Pool of realistic UK Train departures with Security/BTP & Station notices
    const destinationsPool = [
      { name: "ILKLEY", stops: "Calling at: Kirkstall Forge, Guiseley, Menston, Burley-in-Wharfedale, Ilkley" },
      { name: "PLYMOUTH", stops: "Calling at: Wakefield Westgate, Sheffield, Derby, Birmingham New Street, Bristol Temple Meads, Plymouth" },
      { name: "BRADFORD F SQ", stops: "Calling at: Shipley, Frizinghall, Bradford Forster Square" },
      { name: "MANCHESTER VIC", stops: "Calling at: Pudsey, Bradford, Halifax, Hebden Bridge, Todmorden, Manchester Victoria" },
      { name: "REDCAR CENTRAL", stops: "Calling at: York, Thirsk, Northallerton, Middlesbrough, Redcar Central" },
      { name: "LONDON KINGS X", stops: "Calling at: Wakefield Westgate, Doncaster, Peterborough, London King's Cross • BTP: See it. Say it. Sorted. Text 61016", notice: true },
      { name: "LIVERPOOL L ST", stops: "Calling at: Huddersfield, Stalybridge, Manchester Victoria, Liverpool Lime Street" },
      { name: "YORK", stops: "Calling at: Cross Gates, Garforth, Micklefield, Church Fenton, York" },
      { name: "CHESTER", stops: "Calling at: Bramley, New Pudsey, Bradford Interchange, Halifax, Chester" },
      { name: "MORECAMBE", stops: "Calling at: Shipley, Bingley, Keighley, Skipton, Lancaster, Morecambe" },
      { name: "HALIFAX", stops: "Bus replacement will depart from Wellington Street • Report unusual behavior to British Transport Police", notice: true },
      { name: "DONCASTER", stops: "Calling at: Outwood, Wakefield Kirkgate, Fitzwilliam, Doncaster" }
    ];

    const platformsPool = ["17A", "TBC", "2C", "9B", "17A", "Bus", "5C", "6A", "11D", "12A", "0", "1B"];

    function pad(n) { return n.toString().padStart(2, '0'); }

    let allServices = [];
    let lastMinute = -1;
    let lastStateFlipped = null;

    function generateServices() {
      let now = new Date();
      allServices = [];

      for (let i = 0; i < 12; i++) {
        let t = new Date(now.getTime() + (i * 4 + 2) * 60000);
        let dest = destinationsPool[i % destinationsPool.length];
        let plat = platformsPool[i % platformsPool.length];

        let rand = Math.random();
        let status = "On time";
        let statusClass = "status-ontime";

        if (rand < 0.25) {
          let expMin = pad((t.getMinutes() + Math.floor(Math.random() * 12) + 3) % 60);
          status = `Exp ${t.getHours()}:${expMin}`;
          statusClass = "status-delayed";
        } else if (rand < 0.32) {
          status = "Delayed";
          statusClass = "status-delayed";
        } else if (rand < 0.36) {
          status = "Cancelled";
          statusClass = "status-cancelled";
        }

        allServices.push({
          time: `${pad(t.getHours())}:${pad(t.getMinutes())}`,
          destination: dest.name,
          stops: dest.stops,
          isNotice: dest.notice || false,
          platform: plat,
          status: status,
          statusClass: statusClass
        });
      }
    }

    function renderScreen(elementId, items) {
      let container = document.getElementById(elementId);
      container.innerHTML = "";

      items.forEach(item => {
        let div = document.createElement("div");
        div.className = "dept-item";

        div.innerHTML = `
          <div class="dept-main-row">
            <span class="dept-time">${item.time}</span>
            <span class="dept-dest">${item.destination}</span>
            <span class="dept-plat">${item.platform}</span>
            <span class="dept-status ${item.statusClass}">${item.status}</span>
          </div>
          <div class="marquee-container">
            <span class="marquee-text ${item.isNotice ? 'notice' : ''}">${item.stops}</span>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function renderFormation() {
      let next = allServices[0];
      if (!next) return;

      document.getElementById("next-service-label").innerText = 
        `${next.time} ${next.destination} (PLAT ${next.platform}) — FORMATION`;

      let row = document.getElementById("formation-row");
      row.innerHTML = "";

      let coaches = ["Loco", "Coach A (1st)", "Coach B", "Coach C", "Coach D", "Coach E"];
      coaches.forEach((c, idx) => {
        let box = document.createElement("div");
        box.className = `coach-box ${idx === 1 ? "first" : ""}`;
        box.innerText = c;
        row.appendChild(box);
      });
    }

    function tick() {
      let now = new Date();

      document.getElementById("clock-hhmm").innerText = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
      document.getElementById("clock-ss").innerText = pad(now.getSeconds());

      let minuteChanged = now.getMinutes() !== lastMinute;
      if (minuteChanged) {
        generateServices();
        lastMinute = now.getMinutes();
        renderFormation();
      }

      // 15-Second Page Turn Cycle
      let isFlipped = Math.floor(now.getSeconds() / 15) % 2 === 1;

      if (isFlipped !== lastStateFlipped || minuteChanged) {
        lastStateFlipped = isFlipped;

        if (!isFlipped) {
          renderScreen("screen1-list", allServices.slice(0, 4));
          renderScreen("screen2-list", allServices.slice(4, 8));
          document.getElementById("page1-tag").innerText = "Page 1 of 2";
          document.getElementById("page2-tag").innerText = "Page 2 of 2";
        } else {
          renderScreen("screen1-list", allServices.slice(2, 6));
          renderScreen("screen2-list", allServices.slice(6, 10));
          document.getElementById("page1-tag").innerText = "Page 2 of 2";
          document.getElementById("page2-tag").innerText = "Page 1 of 2";
        }
      }
    }

    generateServices();
    renderFormation();
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
