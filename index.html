<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Leeds Station - Concourse Display</title>
  <style>
    :root {
      --bg-black: #000000;
      --screen-bg: #030508;
      --card-border: #1a2332;
      --text-white: #ffffff;
      --text-gray: #94a3b8;
      --text-yellow: #ffcc00;
      --status-ontime: #ffffff;
      --status-delayed: #ffcc00;
      --status-cancelled: #ff4d4d;
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px) 12px;
    }

    .mobile-container {
      width: 100%;
      max-width: 430px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .concourse-frame {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      background-color: #0c0f14;
      padding: 10px;
      border: 2px solid #1c2430;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .board-screen {
      background-color: var(--screen-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
    }

    .screen-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222d3d;
      padding-bottom: 4px;
      margin-bottom: 6px;
    }

    .screen-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-white);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .page-tag {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-gray);
    }

    .dept-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dept-item {
      display: flex;
      flex-direction: column;
      width: 100%;
      padding-bottom: 6px;
      border-bottom: 1px dashed #141c28;
    }

    /* Fixed Row Layout: Spans entire width cleanly */
    .dept-main-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      width: 100%;
      gap: 6px;
    }

    .dept-time {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text-white);
      font-family: ui-monospace, SFMono-Regular, monospace;
      min-width: 45px;
    }

    .dept-dest {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-white);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: uppercase;
      flex-grow: 1;
    }

    .dept-plat {
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--text-white);
      text-align: center;
      font-family: ui-monospace, SFMono-Regular, monospace;
      min-width: 35px;
    }

    .dept-status {
      font-weight: 700;
      font-size: 0.8rem;
      text-align: right;
      min-width: 65px;
    }

    .status-ontime { color: var(--status-ontime); }
    .status-delayed { color: var(--status-delayed); }
    .status-cancelled { color: var(--status-cancelled); }

    /* FULL WIDTH MARQUEE FIX */
    .marquee-container {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      margin-top: 3px;
      position: relative;
    }

    .marquee-text {
      display: inline-block;
      font-size: 0.72rem;
      color: var(--text-gray);
      font-family: ui-monospace, SFMono-Regular, monospace;
      animation: fullWidthMarquee 15s linear infinite;
      will-change: transform;
    }

    .marquee-text.notice {
      color: var(--text-yellow);
    }

    /* Full width translation across the screen */
    @keyframes fullWidthMarquee {
      0% {
        transform: translateX(100%);
      }
      100% {
        transform: translateX(-100%);
      }
    }

    .welcome-screen {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: linear-gradient(180deg, #05080e 0%, #030508 100%);
    }

    .welcome-text {
      font-size: 1.2rem;
      font-weight: 800;
      line-height: 1.1;
      color: var(--text-white);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .clock-box {
      font-family: ui-monospace, SFMono-Regular, monospace;
      color: var(--text-white);
      display: flex;
      align-items: baseline;
    }

    .clock-hhmm {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
    }

    .clock-ss {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1;
      margin-left: 1px;
      color: var(--text-yellow);
    }

    .sub-panel {
      width: 100%;
      background-color: #0c0f14;
      border: 1px solid #1c2430;
      border-radius: 10px;
      padding: 10px 12px;
    }

    .sub-panel-title {
      color: var(--text-yellow);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .formation-row {
      display: flex;
      gap: 6px;
      align-items: center;
      overflow-x: auto;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
    }

    .coach-box {
      background-color: #1a2332;
      border: 1px solid #2d3b52;
      padding: 4px 8px;
      border-radius: 4px;
      text-align: center;
      font-weight: bold;
      font-size: 0.72rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .coach-box.first {
      background-color: #854d0e;
      border-color: #a16207;
    }
  </style>
</head>
<body>

  <div class="mobile-container">
    <div class="concourse-frame">
      
      <div class="board-screen">
        <div class="screen-header">
          <span class="screen-title">Departures</span>
          <span class="page-tag" id="page1-tag">Page 1 of 2</span>
        </div>
        <div class="dept-list" id="screen1-list"></div>
      </div>

      <div class="board-screen">
        <div class="screen-header">
          <span class="screen-title">Departures</span>
          <span class="page-tag" id="page2-tag">Page 2 of 2</span>
        </div>
        <div class="dept-list" id="screen2-list"></div>
      </div>

      <div class="board-screen welcome-screen">
        <div class="welcome-text">
          Welcome<br>to Leeds
        </div>

        <div class="clock-box">
          <span class="clock-hhmm" id="clock-hhmm">08:10</span>
          <span class="clock-ss" id="clock-ss">19</span>
        </div>
      </div>

    </div>

    <div class="sub-panel">
      <div class="sub-panel-title" id="next-service-label">Next Service Coach Formation</div>
      <div class="formation-row" id="formation-row"></div>
    </div>
  </div>

  <script>
    const destinationsPool = [
      { name: "Chester", stops: "Calling at: Bramley, New Pudsey, Bradford Interchange, Halifax, Chester" },
      { name: "Hull", stops: "Calling at: Cross Gates, Garforth, Selby, Brough, Hull" },
      { name: "Ilkley", stops: "Calling at: Kirkstall Forge, Guiseley, Menston, Burley-in-Wharfedale, Ilkley" },
      { name: "Plymouth", stops: "Calling at: Wakefield Westgate, Sheffield, Derby, Birmingham New Street, Bristol Temple Meads, Plymouth" },
      { name: "Bradford F Sq", stops: "Calling at: Shipley, Frizinghall, Bradford Forster Square" },
      { name: "Manchester Vic", stops: "Calling at: Pudsey, Bradford, Halifax, Hebden Bridge, Todmorden, Manchester Victoria" },
      { name: "Redcar Central", stops: "Calling at: York, Thirsk, Northallerton, Middlesbrough, Redcar Central" },
      { name: "London Kings X", stops: "Calling at: Wakefield Westgate, Doncaster, Peterborough, London King's Cross • Reserve seats at LNER.co.uk", notice: true },
      { name: "Liverpool L St", stops: "Calling at: Huddersfield, Stalybridge, Manchester Victoria, Liverpool Lime Street" },
      { name: "York", stops: "Calling at: Cross Gates, Garforth, Micklefield, Church Fenton, York" },
      { name: "Wigan Wallgate", stops: "Calling at: Halifax, Todmorden, Rochdale, Manchester, Wigan Wallgate" },
      { name: "Morecambe", stops: "Calling at: Shipley, Bingley, Keighley, Skipton, Lancaster, Morecambe" },
      { name: "Halifax", stops: "Bus replacement will depart from Wellington Street for all intermediate stops", notice: true },
      { name: "Doncaster", stops: "Calling at: Outwood, Wakefield Kirkgate, Fitzwilliam, Doncaster" },
      { name: "Skipton", stops: "Calling at: Kirkstall Forge, Shipley, Bingley, Keighley, Skipton" },
      { name: "Knaresborough", stops: "Calling at: Burley Park, Headingley, Horsforth, Pannal, Harrogate, Knaresborough" }
    ];

    const platformsPool = ["0", "1A", "2C", "3B", "5C", "6A", "9B", "11A", "11D", "12A", "13B", "16", "17A", "TBC", "Bus"];

    function pad(n) { return n.toString().padStart(2, '0'); }

    let allServices = [];
    let lastMinute = -1;

    function generateServices() {
      let now = new Date();
      allServices = [];

      for (let i = 0; i < 12; i++) {
        let t = new Date(now.getTime() + (i * 4 + 2) * 60000);
        let dest = destinationsPool[i % destinationsPool.length];
        let plat = platformsPool[Math.floor(Math.random() * platformsPool.length)];

        let rand = Math.random();
        let status = "On time";
        let statusClass = "status-ontime";

        if (rand < 0.2) {
          let expMin = pad((t.getMinutes() + Math.floor(Math.random() * 12) + 3) % 60);
          status = `Exp ${t.getHours()}:${expMin}`;
          statusClass = "status-delayed";
        } else if (rand < 0.25) {
          status = "Delayed";
          statusClass = "status-delayed";
        } else if (rand < 0.28) {
          status = "Cancelled";
          statusClass = "status-cancelled";
        }

        allServices.push({
          time: `${pad(t.getHours())}:${pad(t.getMinutes())}`,
          destination: dest.name,
          stops: dest.stops,
          isNotice: dest.notice || false,
          platform: plat,
          status: status,
          statusClass: statusClass
        });
      }
    }

    function renderScreen(elementId, items) {
      let container = document.getElementById(elementId);
      container.innerHTML = "";

      items.forEach(item => {
        let div = document.createElement("div");
        div.className = "dept-item";

        div.innerHTML = `
          <div class="dept-main-row">
            <span class="dept-time">${item.time}</span>
            <span class="dept-dest">${item.destination}</span>
            <span class="dept-plat">${item.platform}</span>
            <span class="dept-status ${item.statusClass}">${item.status}</span>
          </div>
          <div class="marquee-container">
            <span class="marquee-text ${item.isNotice ? 'notice' : ''}">${item.stops}</span>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function renderFormation() {
      let next = allServices[0];
      if (!next) return;

      document.getElementById("next-service-label").innerText = 
        `Next: ${next.time} ${next.destination} (Plat ${next.platform}) — Formation`;

      let row = document.getElementById("formation-row");
      row.innerHTML = "";

      let coaches = ["Loco", "Coach A (1st)", "Coach B", "Coach C", "Coach D", "Coach E"];
      coaches.forEach((c, idx) => {
        let box = document.createElement("div");
        box.className = `coach-box ${idx === 1 ? "first" : ""}`;
        box.innerText = c;
        row.appendChild(box);
      });
    }

    function tick() {
      let now = new Date();

      document.getElementById("clock-hhmm").innerText = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
      document.getElementById("clock-ss").innerText = pad(now.getSeconds());

      if (now.getMinutes() !== lastMinute) {
        generateServices();
        lastMinute = now.getMinutes();
      }

      let isFlipped = Math.floor(now.getSeconds() / 15) % 2 === 1;

      if (!isFlipped) {
        renderScreen("screen1-list", allServices.slice(0, 4));
        renderScreen("screen2-list", allServices.slice(4, 8));
        document.getElementById("page1-tag").innerText = "Page 1 of 2";
        document.getElementById("page2-tag").innerText = "Page 2 of 2";
      } else {
        renderScreen("screen1-list", allServices.slice(2, 6));
        renderScreen("screen2-list", allServices.slice(6, 10));
        document.getElementById("page1-tag").innerText = "Page 2 of 2";
        document.getElementById("page2-tag").innerText = "Page 1 of 2";
      }

      renderFormation();
    }

    generateServices();
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
