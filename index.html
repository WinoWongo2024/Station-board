<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leeds Station - Concourse Board Display</title>
  <style>
    :root {
      --screen-bg: #030508;
      --card-border: #1a2332;
      --text-white: #ffffff;
      --text-gray: #a0aab8;
      --text-yellow: #ffcc00;
      --status-ontime: #ffffff;
      --status-delayed: #ffcc00;
      --status-cancelled: #ff4d4d;
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
    }

    body {
      background-color: #000000;
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* 3-Panel Concourse Physical Board Frame */
    .concourse-frame {
      display: grid;
      grid-template-columns: 1fr 1fr 0.7fr;
      gap: 12px;
      width: 100%;
      max-width: 1400px;
      background-color: #0c0f14;
      padding: 16px;
      border: 4px solid #1c2430;
      border-radius: 8px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
    }

    /* Screens Base Styling */
    .board-screen {
      background-color: var(--screen-bg);
      border: 2px solid var(--card-border);
      border-radius: 4px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 620px;
    }

    /* Board Header */
    .screen-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #222d3d;
      padding-bottom: 8px;
      margin-bottom: 8px;
    }

    .screen-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-white);
    }

    .page-tag {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-white);
    }

    /* Departure Tables */
    .dept-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-grow: 1;
    }

    .dept-item {
      display: flex;
      flex-direction: column;
      padding: 4px 0;
      border-bottom: 1px dashed #141c28;
    }

    .dept-main-row {
      display: grid;
      grid-template-columns: 60px 1fr 50px 85px;
      align-items: baseline;
      gap: 8px;
    }

    .dept-time {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text-white);
    }

    .dept-dest {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-white);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dept-plat {
      font-weight: 700;
      font-size: 1rem;
      color: var(--text-white);
      text-align: center;
    }

    .dept-status {
      font-weight: 700;
      font-size: 0.95rem;
      text-align: right;
    }

    .status-ontime { color: var(--status-ontime); }
    .status-delayed { color: var(--status-delayed); }
    .status-cancelled { color: var(--status-cancelled); }

    /* Secondary Line (via / notice) */
    .dept-sub-row {
      font-size: 0.8rem;
      color: var(--text-gray);
      margin-left: 60px;
      margin-top: 1px;
    }

    .dept-notice {
      color: var(--text-yellow);
      font-size: 0.78rem;
    }

    /* Screen 3: Welcome & Clock Screen */
    .welcome-screen {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 40px 16px 20px 16px;
    }

    .welcome-text {
      font-size: 2.8rem;
      font-weight: 700;
      line-height: 1.25;
      color: var(--text-white);
      margin-top: 60px;
    }

    /* Specific Clock Layout: Huge HH:MM, small ss */
    .clock-box {
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--text-white);
      display: flex;
      align-items: baseline;
      justify-content: center;
      margin-bottom: 20px;
    }

    .clock-hhmm {
      font-size: 5rem;
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
    }

    .clock-ss {
      font-size: 2.6rem;
      font-weight: 700;
      line-height: 1;
      margin-left: 2px;
    }

    /* Sub-board panel for Coach formation under frame */
    .sub-panel {
      width: 100%;
      max-width: 1400px;
      background-color: #0c0f14;
      border: 2px solid #1c2430;
      border-radius: 8px;
      margin-top: 16px;
      padding: 16px 24px;
    }

    .sub-panel-title {
      color: var(--text-yellow);
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .formation-row {
      display: flex;
      gap: 8px;
      align-items: center;
      overflow-x: auto;
    }

    .coach-box {
      background-color: #1a2332;
      border: 1px solid #2d3b52;
      padding: 6px 12px;
      border-radius: 4px;
      text-align: center;
      font-weight: bold;
      font-size: 0.85rem;
    }

    .coach-box.first {
      background-color: #854d0e;
      border-color: #a16207;
    }

    @media (max-width: 1024px) {
      .concourse-frame {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div style="display:flex; flex-direction:column; align-items:center; width:100%;">
    <!-- 3-PANEL PHYSICAL BOARD SETUP -->
    <div class="concourse-frame">
      
      <!-- SCREEN 1: DEPARTURES (PAGE 1 OF 2) -->
      <div class="board-screen">
        <div>
          <div class="screen-header">
            <span class="screen-title">Departures</span>
            <span class="page-tag" id="page1-tag">Page 1 of 2</span>
          </div>
          <div class="dept-list" id="screen1-list">
            <!-- Populated dynamically -->
          </div>
        </div>
      </div>

      <!-- SCREEN 2: DEPARTURES (PAGE 2 OF 2) -->
      <div class="board-screen">
        <div>
          <div class="screen-header">
            <span class="screen-title">Departures</span>
            <span class="page-tag" id="page2-tag">Page 2 of 2</span>
          </div>
          <div class="dept-list" id="screen2-list">
            <!-- Populated dynamically -->
          </div>
        </div>
      </div>

      <!-- SCREEN 3: WELCOME & REAL-TIME CLOCK -->
      <div class="board-screen welcome-screen">
        <div class="welcome-text">
          Welcome<br>to<br>Leeds
        </div>

        <div class="clock-box">
          <span class="clock-hhmm" id="clock-hhmm">08:10</span>
          <span class="clock-ss" id="clock-ss">19</span>
        </div>
      </div>

    </div>

    <!-- NEXT SERVICE COACH FORMATION -->
    <div class="sub-panel">
      <div class="sub-panel-title" id="next-service-label">Next Service Coach Formation</div>
      <div class="formation-row" id="formation-row">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <script>
    const destinationsPool = [
      { name: "Chester", via: "via Halifax" },
      { name: "Hull", via: "" },
      { name: "Ilkley", via: "" },
      { name: "Plymouth", via: "via Sheffield" },
      { name: "Bradford F Sq", via: "" },
      { name: "Manchester Vic", via: "via Halifax" },
      { name: "Redcar Central", via: "via Middlesbrough" },
      { name: "London Kings X", via: "", notice: "Reserve seats up to 5 minutes before departure at LNER.co.uk" },
      { name: "Liverpool L St", via: "via Manchester Vic" },
      { name: "York", via: "" },
      { name: "Wigan Wallgate", via: "via Halifax" },
      { name: "Morecambe", via: "via Lancaster" },
      { name: "Halifax", via: "via Dewsbury", notice: "Bus replacement will depart from Wellington Street" },
      { name: "Doncaster", via: "" },
      { name: "Skipton", via: "" },
      { name: "Knaresborough", via: "via Harrogate" },
      { name: "Poppleton", via: "via Harrogate" },
      { name: "Knottingley", via: "via Wakefield Westgate" },
      { name: "Sheffield", via: "via Castleford" }
    ];

    const platformsPool = ["0", "1A", "2C", "3B", "5C", "6A", "9B", "11A", "11D", "12A", "13B", "16", "17A", "TBC", "Bus"];

    function pad(n) { return n.toString().padStart(2, '0'); }

    let allServices = [];
    let lastMinute = -1;

    function generateServices() {
      let now = new Date();
      allServices = [];

      for (let i = 0; i < 20; i++) {
        let t = new Date(now.getTime() + (i * 3 + 2) * 60000);
        let dest = destinationsPool[i % destinationsPool.length];
        let plat = platformsPool[Math.floor(Math.random() * platformsPool.length)];

        let rand = Math.random();
        let status = "On time";
        let statusClass = "status-ontime";

        if (rand < 0.2) {
          let expMin = pad((t.getMinutes() + Math.floor(Math.random() * 15) + 3) % 60);
          status = `Exp ${t.getHours()}:${expMin}`;
          statusClass = "status-delayed";
        } else if (rand < 0.25) {
          status = "Delayed";
          statusClass = "status-delayed";
        } else if (rand < 0.28) {
          status = "Cancelled";
          statusClass = "status-cancelled";
        }

        allServices.push({
          time: `${pad(t.getHours())}:${pad(t.getMinutes())}`,
          destination: dest.name,
          via: dest.via,
          notice: dest.notice || "",
          platform: plat,
          status: status,
          statusClass: statusClass
        });
      }
    }

    function renderScreen(elementId, items) {
      let container = document.getElementById(elementId);
      container.innerHTML = "";

      items.forEach(item => {
        let div = document.createElement("div");
        div.className = "dept-item";

        let subContent = "";
        if (item.notice) {
          subContent = `<div class="dept-sub-row dept-notice">${item.notice}</div>`;
        } else if (item.via) {
          subContent = `<div class="dept-sub-row">${item.via}</div>`;
        }

        div.innerHTML = `
          <div class="dept-main-row">
            <span class="dept-time">${item.time}</span>
            <span class="dept-dest">${item.destination}</span>
            <span class="dept-plat">${item.platform}</span>
            <span class="dept-status ${item.statusClass}">${item.status}</span>
          </div>
          ${subContent}
        `;
        container.appendChild(div);
      });
    }

    function renderFormation() {
      let next = allServices[0];
      if (!next) return;

      document.getElementById("next-service-label").innerText = 
        `Next Departure: ${next.time} ${next.destination} (Plat ${next.platform}) — Coach Formation`;

      let row = document.getElementById("formation-row");
      row.innerHTML = "";

      let coaches = ["Loco", "Coach A (1st)", "Coach B", "Coach C", "Coach D", "Coach E", "Coach F"];
      coaches.forEach((c, idx) => {
        let box = document.createElement("div");
        box.className = `coach-box ${idx === 1 ? "first" : ""}`;
        box.innerText = c;
        row.appendChild(box);
      });
    }

    function tick() {
      let now = new Date();

      // Update Screen 3 Live Clock (Huge HH:MM, smaller ss)
      document.getElementById("clock-hhmm").innerText = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
      document.getElementById("clock-ss").innerText = pad(now.getSeconds());

      // Regenerate dataset on minute change
      if (now.getMinutes() !== lastMinute) {
        generateServices();
        lastMinute = now.getMinutes();
      }

      // Page flipping rotation every 8 seconds across the screens
      let isFlipped = Math.floor(now.getSeconds() / 8) % 2 === 1;

      if (!isFlipped) {
        renderScreen("screen1-list", allServices.slice(0, 9));
        renderScreen("screen2-list", allServices.slice(9, 18));
        document.getElementById("page1-tag").innerText = "Page 1 of 2";
        document.getElementById("page2-tag").innerText = "Page 2 of 2";
      } else {
        renderScreen("screen1-list", allServices.slice(2, 11));
        renderScreen("screen2-list", allServices.slice(11, 20));
        document.getElementById("page1-tag").innerText = "Page 2 of 2";
        document.getElementById("page2-tag").innerText = "Page 1 of 2";
      }

      renderFormation();
    }

    // Run immediately then tick every second
    generateServices();
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
